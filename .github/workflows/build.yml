name: Build & Verify LASH

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build LASH (C++/Qt6/LevelDB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev libleveldb-dev

      - name: Configure CMake
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build

      - name: Compile Binary
        run: cmake --build build

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lash-binary
          path: build/lash
